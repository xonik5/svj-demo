<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E5A3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Schützenverein Judenbach – App (Vorschau)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="https://schuetzenverein-judenbach.de/wp-content/uploads/2018/04/cropped-logoschutzenvereinneu.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;700&family=Alegreya:wght@700&family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;700&family=Lexend:wght@400;600;700&family=Lora:wght@600;700&family=Merriweather:wght@700;900&family=Nunito+Sans:wght@400;600;700&family=Roboto+Slab:wght@600;700&family=Sora:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
html,body{margin:0;padding:0}#pres{display:none!important}
/* ===== Grundgerüst – gilt für alle 5 Designs; Farben/Schriften kommen aus dem Theme ===== */
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* Vorführ-Leiste (nur großer Bildschirm) */
#pres{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 12px;background:#15181c;color:#e9ecef;font:500 14px/1 system-ui,sans-serif;position:sticky;top:0;z-index:100}
#pres .pname{font-weight:700;letter-spacing:.02em}#pres .pview{opacity:.7}
#pres select{background:#23282e;color:#fff;border:1px solid #3a4048;border-radius:6px;padding:8px 10px;font:600 14px system-ui,sans-serif;max-width:60vw}
.pseg{display:flex;border:1px solid #3a4048;border-radius:6px;overflow:hidden}.pseg button{border:0;background:transparent;color:#cfd4da;padding:9px 14px;font:600 14px system-ui,sans-serif}.pseg button.on{background:#e9ecef;color:#15181c}
@media (max-width:600px){#pres .pview{display:none}}
/* Bühne: Webseite oder Handy-Rahmen */
.stage{padding-inline:0}
.device{container-type:inline-size;container-name:dev;background:var(--bg)}
.stage.app{padding:24px 16px 40px}
@media (max-width:899px){.stage.app{padding:0}.stage.app .device{width:auto;height:auto;border:0;border-radius:0;box-shadow:none}.stage.app .shell{height:auto;overflow:visible}}
.stage.app .device{width:390px;max-width:100%;height:min(820px,calc(100vh - 110px));margin:0 auto;border-radius:46px;border:12px solid #101214;box-shadow:0 30px 70px rgba(0,0,0,.35);overflow:hidden}
.stage.app .shell{height:100%;overflow:auto;overscroll-behavior:contain}
.shell{font-size:calc(var(--base,19px) * var(--fs,1));line-height:1.5;background:var(--bg);color:var(--ink);min-height:100%;display:flex;flex-direction:column}
/* Kopf */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head-bg,var(--surface));border-bottom:var(--head-border,1px solid var(--line))}
.stage.app .head{top:0}
.headin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;color:var(--head-ink,var(--ink))}
.brand b{display:block;font:700 1.05em/1.1 var(--font-head);letter-spacing:var(--head-track,0)}
.brand small{display:block;font-size:.7em;color:var(--head-muted,var(--muted))}
.backbtn{display:flex;align-items:center;gap:6px;min-height:52px;padding:0 14px 0 8px;border-radius:var(--radius);border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700}
.backbtn .ic{width:1.3em;height:1.3em}
.webnav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.webnav button{background:none;border:0;padding:10px 12px;border-radius:var(--radius);font-weight:600;color:var(--head-ink,var(--ink));font-size:.92em}
.webnav button.on{background:var(--nav-on,var(--accent));color:var(--nav-on-ink,var(--on-accent))}
.headr{display:flex;gap:8px;margin-left:12px}
.helpbtn,.acctbtn{display:flex;align-items:center;gap:6px;min-height:48px;padding:0 12px;border-radius:var(--radius);border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:.9em}
.acctbtn.in{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.helpbtn .ic,.acctbtn .ic{width:1.3em;height:1.3em}
.main{flex:1;width:100%}
.page{max-width:var(--page-w,860px);margin:0 auto;padding:22px 16px 40px}
.foot{max-width:1180px;margin:0 auto;padding:18px 16px 28px;font-size:.78em;color:var(--muted);border-top:1px solid var(--line)}
.appnav{display:none}
.count{display:inline-grid;place-items:center;min-width:1.4em;height:1.4em;padding:0 .35em;border-radius:1em;background:var(--bad);color:#fff;font-size:.75em;font-weight:700}
/* ---- Oberfläche „App“ (Klasse ui-app) ---- */
.ui-app .webnav,.ui-app .webonly,.ui-app .foot,.ui-app .navrow,.ui-app .utility,.ui-app .menubtn{display:none!important}
.ui-app .headin{padding:8px 12px;min-height:60px}
.ui-app .headr{margin-left:auto}.ui-app .helpbtn span{display:none}.ui-app .helpbtn{padding:0 10px}
.ui-app .acctbtn span{max-width:6.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ui-app .brand small{display:none}
.ui-app .page{padding:16px 14px 28px;max-width:640px}
.ui-app .appnav{display:grid;grid-template-columns:repeat(5,1fr);position:sticky;bottom:0;z-index:20;background:var(--appnav-bg,var(--surface));border-top:var(--appnav-border,1px solid var(--line));padding-bottom:env(safe-area-inset-bottom,0px)}
.appnav button{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;font-size:.66em;font-weight:700;color:var(--appnav-ink,var(--muted));min-height:64px}
.appnav .ic{width:26px;height:26px}
.appnav button.on{color:var(--appnav-on,var(--brand))}
.appnav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;border-radius:0 0 4px 4px;background:var(--appnav-on,var(--brand))}
.appnav .count{position:absolute;top:6px;left:56%}
.ui-app .title{font-size:1.45em!important}
@container dev (max-width:480px){.ui-app .acctbtn span{display:none}.ui-app .acctbtn{padding:0 10px}.ui-app .brand b{font-size:.92em}.ui-app .brand .logo{width:36px;height:36px}}
/* ---- Typo ---- */
.title{font-family:var(--font-head);font-size:clamp(1.5em,4.2vw,2.1em);line-height:1.15;margin:0 0 .35em;text-wrap:balance;font-weight:var(--head-weight,700)}
.hint{color:var(--muted);margin:0 0 1em;max-width:60ch}
.stepno{display:inline-block;margin:0 0 .5em;padding:.2em .7em;border-radius:1em;background:var(--accent-soft,var(--line));color:var(--ink);font-weight:700;font-size:.8em}
.greet{margin:0 0 .2em;color:var(--muted);font-size:1.05em}
.sub{font-family:var(--font-head);font-size:1.1em;margin:1.2em 0 .5em;font-weight:700}
.sub.month{margin-top:1.4em}
.h3{font-size:1em;margin:.8em 0 .3em}
.small{font-size:.85em}.muted{color:var(--muted)}
.lead{font-size:1.15em}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-num,var(--font-body));letter-spacing:.02em}
.num.big{font-size:1.4em}.num.huge{font-size:2.2em;font-weight:700;margin:.1em 0}
.note{background:var(--warn-bg);border-left:5px solid var(--warn);padding:.7em .9em;border-radius:var(--radius);margin:1em 0}
.err{color:var(--bad);font-weight:700;min-height:1em;margin:.3em 0}
.empty{padding:1.2em;border:2px dashed var(--line);border-radius:var(--radius);text-align:center;color:var(--muted)}
.crumb{color:var(--muted);font-weight:700;font-size:.85em;margin:0 0 .3em;text-transform:uppercase;letter-spacing:.06em}
/* ---- Knöpfe ---- */
.ic{width:1.6em;height:1.6em;flex:0 0 auto}
.stackv{display:flex;flex-direction:column;gap:12px}
.actions{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.primary,.secondary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;padding:10px 18px;border-radius:var(--radius);font-weight:700;font-size:1.05em;text-align:center}
.primary{background:var(--brand);color:var(--on-brand);border:2px solid var(--brand)}
.secondary{background:var(--surface);color:var(--ink);border:2px solid var(--ink-line,var(--ink))}
.primary:disabled{opacity:.4;cursor:not-allowed}
.primary.slim,.secondary.slim{width:auto;min-height:48px;font-size:.85em;padding:6px 12px}
.withic .ic{width:1.4em;height:1.4em}
.link{background:none;border:0;color:var(--brand-text,var(--brand));text-decoration:underline;font-weight:700;padding:.4em 0}
.link.center{align-self:center}
.big{display:flex;align-items:center;gap:14px;width:100%;min-height:78px;padding:12px 16px;border-radius:var(--radius);border:2px solid var(--line);background:var(--surface);color:var(--ink);text-align:left}
.big .ic{width:2em;height:2em;color:var(--brand-text,var(--brand))}
.big .bt{flex:1}.big b{display:block;font-size:1.05em}.big small{display:block;color:var(--muted)}
.chev{width:1.2em!important;height:1.2em!important;color:var(--muted)!important;margin-left:auto}
.list{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .rt{flex:1 1 12em;min-width:0}.row .rt b{display:block}.row .rt small{display:block;color:var(--muted);font-size:.85em}
.row.static{cursor:default}
.rchip{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:.25em .7em;border-radius:1em;font-size:.78em;font-weight:700;background:var(--line);color:var(--ink);line-height:1.3}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn-ink,var(--ink))}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.neutral{background:var(--surface);border:1px solid var(--line);color:var(--muted)}.chip.in{background:var(--brand);color:var(--on-brand)}.chip.comp{background:var(--comp-bg);color:var(--comp)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5em,1fr));gap:12px}
.choices.wide{grid-template-columns:1fr}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:78px;padding:12px 14px;border-radius:var(--radius);border:2px solid var(--line);background:var(--surface);color:var(--ink);text-align:left}
.choice b{font-size:1.25em}.choice span{font-weight:600}.choice small{color:var(--muted)}
.choice.small{min-height:60px}.choice.small b{font-size:1.05em}
.choice.sel{border-color:var(--brand);background:var(--sel-bg,var(--accent-soft));box-shadow:inset 0 0 0 2px var(--brand)}
.choice:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
details.more{margin-top:14px}
details.more>summary{cursor:pointer;min-height:56px;display:flex;align-items:center;padding:0 14px;border-radius:var(--radius);border:2px dashed var(--line);font-weight:700;color:var(--brand-text,var(--brand));list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{margin-bottom:10px}
.check{display:flex;gap:12px;align-items:center;min-height:64px;padding:10px 14px;border-radius:var(--radius);border:2px solid var(--line);background:var(--surface);cursor:pointer}
.check input{width:1.4em;height:1.4em;accent-color:var(--brand);flex:0 0 auto}
.check.on{border-color:var(--brand);background:var(--sel-bg,var(--accent-soft))}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.9em}
.field input,.field select,.field textarea,.compose textarea,.codein{font-weight:400;font-size:1.1em;min-height:56px;padding:10px 12px;border:2px solid var(--ink-line,var(--line));border-radius:var(--radius);background:var(--input-bg,#fff);color:var(--ink);width:100%}
.field.grow{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two.three{grid-template-columns:repeat(3,1fr)}
@container dev (max-width:420px){.two.three{grid-template-columns:1fr}}
.inline{display:flex;gap:10px;align-items:flex-end}.inline .primary{width:auto;min-width:5em}
.codein{text-align:center;letter-spacing:.5em;font-size:1.8em;font-weight:700}
.orline{display:flex;align-items:center;gap:10px;color:var(--muted);margin:18px 0}.orline::before,.orline::after{content:"";flex:1;height:2px;background:var(--line)}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--ink-line,var(--line));border-radius:var(--radius);overflow:hidden}
.seg button{border:0;background:var(--surface);min-height:52px;padding:0 16px;font-weight:700;color:var(--ink)}
.seg button.on{background:var(--brand);color:var(--on-brand)}
.segrow{display:flex;flex-direction:column;gap:6px}
/* ---- Flächen ---- */
.panel{border:2px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px 16px;margin:14px 0}
.panel.ok{border-color:var(--ok)}.panel.demo{border-style:dashed}
.panel p{margin:.35em 0}
.summary{display:grid;grid-template-columns:max-content 1fr;gap:10px 18px;border:2px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px;margin:0}
.summary dt{color:var(--muted)}.summary dd{margin:0;font-weight:700}
.done{text-align:center;padding:10px 0}
.big-check{width:84px!important;height:84px!important;color:#fff;background:var(--ok);border-radius:50%;padding:16px;stroke-width:2.6}
.big-fp{width:110px!important;height:110px!important;color:var(--brand);animation:pulse 1.2s ease-in-out infinite;margin:20px auto}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.big-fp{animation:none}}
.dots{display:flex;gap:8px;margin:.6em 0}
.dot{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.8em}
.dot.f{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.dot.sup{border-style:dashed}.dot.sup.f{background:var(--ok);border-color:var(--ok);border-style:solid;color:#fff}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:6px 0}
.rank{margin:0;padding-left:1.4em}.rank li{padding:4px 0}.rank li span{display:inline-block;min-width:60%}
/* Etiketten */
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px;margin-top:10px}
.label{display:grid;grid-template-columns:1fr auto;gap:8px;background:#fff;color:#111;border:1px dashed #888;border-radius:6px;padding:10px;text-align:left;font-size:.8em;line-height:1.25}
.label p{margin:0}.label .lc{font-size:.75em;color:#555;text-transform:uppercase;letter-spacing:.05em}.label .ln{font-weight:800;font-size:1.3em;text-transform:uppercase}.label .lk{margin-top:3px}.label .li{font:700 1.35em/1.3 ui-monospace,monospace;margin-top:4px}.label .lm{color:#555;font-size:.85em}
.label.pick{cursor:pointer}
/* Konto */
.idcard{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--brand);color:var(--on-brand);border-radius:calc(var(--radius) + 4px);padding:18px;margin-bottom:16px}
.idcard p{margin:0}.idcard .idname{font-size:1.2em;font-weight:700}.idcard .chip{background:var(--accent);color:var(--on-accent)}
.idcard .qr{background:#fff;padding:6px;border-radius:6px;line-height:0}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.pics img,.tgt{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--line)}.tgt svg{width:100%;height:100%;display:block}
.filebtn{margin-bottom:14px}
/* Nachrichten */
.msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line)}
.msg p{margin:0}.msg .by{font-size:.75em;color:var(--muted);font-weight:700;margin-bottom:2px}
.msg.me{align-self:flex-end;background:var(--sel-bg,var(--accent-soft));border-color:transparent}
.msg.ann{max-width:100%;border-left:6px solid var(--accent);border-radius:var(--radius)}
.compose{display:flex;flex-direction:column;gap:10px;position:sticky;bottom:0;background:var(--bg);padding:8px 0}
/* Inhalte */
.prose{max-width:65ch}.prose p{margin:.7em 0}.prose h3{font-family:var(--font-head);margin:1.2em 0 .4em;font-size:1.1em}
.facts{display:grid;grid-template-columns:minmax(8em,max-content) 1fr;gap:8px 16px;border:2px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px;margin:1em 0}
.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:700}
@container dev (max-width:480px){.facts{grid-template-columns:1fr;gap:2px}.facts dd{margin-bottom:8px}}
.docrow{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border:2px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);text-decoration:none;margin:8px 0}
.docrow span:nth-child(2){flex:1;font-weight:700}
.docic{flex:0 0 auto;min-width:3.4em;text-align:center;padding:.3em .4em;border-radius:6px;background:var(--brand);color:var(--on-brand);font-size:.72em;font-weight:800;text-transform:uppercase}
.docgo{color:var(--brand-text,var(--brand));font-weight:700;font-size:.85em;white-space:nowrap}
.timeline{list-style:none;padding:0;margin:1em 0;border-left:4px solid var(--accent)}.timeline li{padding:.4em 0 .4em 1em}.timeline b{display:block}
.plain{padding-left:1.2em}.plain li{margin:.3em 0}
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(8em,1fr));gap:12px}
.year{min-height:84px;border-radius:var(--radius);border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:10px 14px;color:var(--ink)}
.year b{font-size:1.4em;font-family:var(--font-head)}.year small{color:var(--muted)}
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:14px}
.album{margin:0;border-radius:var(--radius);overflow:hidden;background:var(--surface);border:2px solid var(--line)}
.album svg,.album img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.album figcaption{padding:10px 12px;font-weight:700}
.helpline{display:flex;gap:12px;align-items:center;margin-top:22px;padding:14px 16px;border-radius:var(--radius);background:var(--surface);border:2px solid var(--line)}
.helpline .ic{width:2em;height:2em;color:var(--brand-text,var(--brand))}.helpline.big{font-size:1.1em}
.sizebox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px}
/* Startseiten */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:10px 0 6px}
@container dev (max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{aspect-ratio:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:var(--radius);border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:10px;text-align:center}
.tile .ic{width:2.6em;height:2.6em;color:var(--brand-text,var(--brand))}.tile b{font-size:1em;line-height:1.2}
.bar{display:flex;align-items:center;gap:16px;width:100%;min-height:86px;padding:12px 18px;border-radius:var(--radius);font-size:1.15em;text-align:left}
.bar .ic{width:1.9em;height:1.9em}
.masthead{border-bottom:4px double var(--ink);margin-bottom:16px;padding-bottom:6px}.kicker{margin:0;text-transform:uppercase;letter-spacing:.12em;font-size:.72em;font-weight:700;color:var(--muted)}
.papercols{display:grid;grid-template-columns:1.4fr 1fr;grid-auto-rows:auto;gap:14px}
.papercols .lead{grid-row:span 2}
@container dev (max-width:760px){.papercols{grid-template-columns:1fr}.papercols .lead{grid-row:auto}}
.story{display:flex;flex-direction:column;gap:6px;text-align:left;border:0;border-top:3px solid var(--ink);background:none;padding:10px 0;color:var(--ink)}
.story b{font-family:var(--font-head);font-size:1.15em;line-height:1.25}.story.lead b{font-size:1.6em}

.fcol button{background:none;border:0;color:inherit;opacity:.82;text-align:left;padding:4px 0;line-height:1.3}.fcol button:hover{opacity:1;text-decoration:underline}
.fbottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid color-mix(in srgb,currentColor 25%,transparent);margin-top:30px;padding-top:18px;opacity:.9}
.fbottom .link{color:inherit}.fbottom .logo{vertical-align:middle}
.ui-web .page:not(.home) .title{font-size:2.1em}

/* Fotos, Video, neue Startseiten 11–15 */
.brandimg{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#fff;flex:0 0 auto}
.media{position:relative;border-radius:var(--radius);overflow:hidden;background:#111;aspect-ratio:16/10}
.heromedia{width:100%;height:100%;object-fit:cover;display:block}
.mediacap{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:.72em}
.fig{margin:1em 0;border-radius:var(--radius);overflow:hidden;background:var(--surface);border:2px solid var(--line)}
.fig img{display:block;width:100%;height:auto;max-height:520px;object-fit:contain;background:#f0efe9}
.fig figcaption{padding:8px 12px;font-size:.85em;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:.8em 0}
.strip .fig{margin:0}.strip .fig img{aspect-ratio:1;object-fit:cover;max-height:none}
.strip.two{grid-template-columns:1fr 1fr}.strip.two .fig img{aspect-ratio:auto;object-fit:contain}
.albumsec{margin-bottom:18px}
.bdslogo{width:90px;float:right;margin:0 0 10px 14px;background:#fff;border-radius:6px;padding:4px}
.fbds{height:34px;vertical-align:middle;background:#fff;border-radius:4px;padding:2px;margin-right:6px}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:6px 0}
@container dev (max-width:860px){.doors{grid-template-columns:1fr}}
.door{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:20px;min-height:150px;border-radius:var(--radius);border:2px solid var(--line);background:var(--surface);color:var(--ink);border-left:8px solid var(--brand)}
.door .ic{width:2.4em;height:2.4em;color:var(--brand-text,var(--brand))}.door b{font-size:1.2em;font-family:var(--font-head)}.door span{color:var(--muted)}
.door:hover{border-color:var(--brand)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0}
@container dev (max-width:600px){.board{grid-template-columns:1fr}}
.pin{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.pin::before{content:"";position:absolute;top:-9px;left:50%;width:18px;height:18px;border-radius:50%;background:var(--accent);box-shadow:0 2px 4px rgba(0,0,0,.35);transform:translateX(-50%)}
.pin p{margin:0}.pin-d{font-family:var(--font-head);font-size:1.2em;font-weight:700}.pin-t{color:var(--muted);font-weight:700}
.pin.ok{border-color:var(--ok)}
.names{list-style:none;padding:0;margin:6px 0;display:flex;flex-direction:column;gap:4px}
.names li{padding:8px 10px;border-bottom:1px dashed var(--line);font-weight:600}.names li.free{color:var(--muted);font-weight:400;font-style:italic}.names li.supl{border:0;color:var(--muted);font-size:.9em}
.board-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:start}
@container dev (max-width:980px){.board-grid{grid-template-columns:1fr}}
.hero-official{padding-block:40px 30px;border-bottom:6px solid var(--brand)}
.official-tasks{margin-top:16px;border:2px solid var(--ink-line,var(--line));border-radius:var(--radius);overflow:hidden;background:var(--surface);max-width:760px}
.ot-h{margin:0;padding:10px 16px;background:var(--brand);color:var(--on-brand);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.75em}
.otask{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:10px 16px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left;font-size:1.05em}
.otask:last-child{border-bottom:0}.otask .ic{color:var(--brand-text,var(--brand))}.otask b{flex:1}
.azbox{margin-top:22px;padding:18px;border-radius:var(--radius);background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.azlist{display:flex;flex-direction:column}
.azl{margin:1.2em 0 .3em;color:var(--brand-text,var(--brand));border-bottom:2px solid var(--line)}
.azrow{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:8px 12px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left;font-weight:600}
.azrow .chev{margin-left:auto}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:14px 0}
@container dev (max-width:760px){.three{grid-template-columns:1fr}}
.huge{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:190px;padding:20px;border-radius:var(--radius);border:3px solid var(--brand);background:var(--surface);color:var(--ink);text-align:center}
.huge .ic{width:3em;height:3em;color:var(--brand-text,var(--brand))}.huge b{font-size:1.5em;font-family:var(--font-head)}.huge span{color:var(--muted)}
.huge:first-child{background:var(--brand);color:var(--on-brand)}.huge:first-child .ic,.huge:first-child span{color:var(--on-brand)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@container dev (max-width:600px){.row3{grid-template-columns:1fr}}
.hero-three{position:relative;overflow:hidden;color:#fff;--ink:#fff;--muted:#d9dde3;--surface:rgba(20,24,28,.82);--line:rgba(255,255,255,.3);--brand-text:var(--accent)}
.hero-three .artbg{position:absolute;inset:0;opacity:.55}.hero-three .artbg .rangeart{border-radius:0;height:100%}
.hero-three::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,18,.85),rgba(10,14,18,.55))}
.hero-three .wrap{position:relative;padding-block:60px}.hero-three .kicker{color:var(--accent)}
.ccard{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px;border-radius:var(--radius);background:var(--surface);border:2px solid var(--line);margin-top:14px}
.ccard p{margin:0}.cav{width:64px;height:64px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:800;font-size:1.3em;flex:0 0 auto}
.ck{font-size:.75em;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--brand-text,var(--brand))}.cn{font-family:var(--font-head);font-size:1.25em;font-weight:700}.cnum{font-size:1.3em;font-weight:800}
.ccard>div{flex:1}
.split-text .doors{grid-template-columns:1fr;gap:10px}.split-text .door{min-height:0;flex-direction:row;align-items:center;flex-wrap:wrap}.split-text .door b{flex:1 1 10em}.split-text .door span{flex-basis:100%;margin-left:calc(2.4em + 8px)}
.hero-three .kicker{margin-top:8px}

 {id:"schiessnachweis",group:"news",date:"2026-10-02",title:"Schießnachweis „Flüchtiger Überläufer“ – Freitag, 2.10.2026",html:`
  <p>Am <b>Freitag, 2. Oktober 2026</b> können Jäger auf dem Schießstand Judenbach ihren Schießnachweis auf den „Flüchtigen Überläufer“ ablegen. Das ist die laufende Wildscheibe in Form eines jungen Wildschweins auf der 50-Meter-Bahn.</p>
  ${FACTS([["Wann","Freitag, 2.10.2026"],["Wo","Schießstand Judenbach"],["Was","Schießnachweis auf die laufende Keilerscheibe"]])}

 {id:"jubilaeum",group:"news",date:"2026-08-15",title:"Ergebnisliste Jubiläumspokalschießen vom 15.08.2026",html:`
  <p>Zum 120-jährigen Bestehen des Vereins fand am <b>15. August 2026</b> das Jubiläumspokalschießen des BDS Thüringen statt. Die vollständige Ergebnisliste steht als Datei bereit.</p>
  ${DOC("Ergebnisliste Jubiläumspokal 15.08.2026",SITE+"/wp-content/uploads/2026/08/Jubilaeumspokal15.08.2026.pdf")}
  <p class="note">In der neuen App stehen Ergebnisse künftig direkt bei jedem Wettkampf und im eigenen Konto.</p>`},
 {id:"waffenbehoerde",group:"news",date:"2026-05-06",title:"Wichtig! Aktuelles Schreiben der Waffenbehörde",html:`
  <p>Die Waffenbehörde hat ein Schreiben an Waffenbesitzer verschickt. Bitte lesen Sie es aufmerksam durch – es geht um aktuelle Vorgaben der Behörde.</p>
  ${DOC("Schreiben der Waffenbehörde vom 06.05.2026",SITE+"/wp-content/uploads/2026/05/MyMFP-Document_06-05-2026_10-47.pdf")}`},
 {id:"jugendweihe",group:"news",date:"2026-05-09",title:"Ehrensalut und Feuerwerk zur Jugendweihe am 09.05.2026",html:`
  <p>Zur Jugendweihe am <b>9. Mai 2026</b> haben unsere Schützen einen Ehrensalut geschossen, anschließend gab es ein Feuerwerk. Zwei kurze Videos zeigen den Moment.</p>
  ${DOC("Video 1 ansehen",SITE+"/wp-content/uploads/2026/05/VXHF5379.mp4","Video")}${DOC("Video 2 ansehen",SITE+"/wp-content/uploads/2026/05/IZJT1775.mp4","Video")}`},
 {id:"pokalschiessen",group:"news",title:"Weitere Pokalschießen",html:`
  <p>Hier stehen die nächsten Pokalschießen des Vereins. Alle Termine finden Sie auch unter <b>„Termine“</b>, und zur Anmeldung geht es mit einem Knopfdruck unter <b>„Wettkämpfe“</b>.</p>
  <p class="note">Auf der bisherigen Seite war dieser Bereich leer. In der neuen App erscheinen neue Pokalschießen automatisch, sobald der Vorstand sie anlegt.</p>`},

 /* ---------- Schießstand ---------- */
 {id:"schiessstand",group:"stand",title:"Der Schießstand",html:`
  ${FIG(IMG.bahnen,"Die Schießbahnen – 100 m und 50 m mit Seilzuganlage")}<p>Unser Schießstand liegt an der Kohlesleite in Judenbach, direkt neben dem Sportplatz. Alle Schützenstände sind <b>überdacht</b>, die Ziele können bei Dunkelheit <b>beleuchtet</b> werden.</p>
  ${FACTS([["4 Bahnen · 100 m","mit Seilzuganlage, bis 7000 Joule"],["2 Bahnen · 50 m","mit Seilzuganlage, bis 7000 Joule, laufender Keiler"],["5 Bahnen · 25 m","Kurzwaffe, bis 1500 Joule, Drehscheibenanlage"]])}
  <p>Auf 50 und 100 Meter schießen Sie stehend angestrichen, liegend oder sitzend aufgelegt.</p>
  <h3>Schießzeiten</h3>
  ${FACTS([["Samstag","13:00 – 16:00 Uhr"],["Sonntag","10:00 – 12:00 Uhr"],["Gruppen ab 5 Schützen","auch unter der Woche nach Absprache"]])}
  <p>Bitte melden Sie sich vorher an – am einfachsten in der App unter <b>„Bahn buchen“</b> oder per WhatsApp: <b>0151 58501287</b>.</p>
  <h3>Gastschützen</h3><p>Wer eine gültige Waffenbesitzkarte (WBK) hat, ist als Gastschütze jederzeit willkommen – auch Jäger, die ihre Waffen einschießen möchten.</p>`},
 {id:"bahnbenutzung",group:"stand",title:"Schießbahnbenutzung & Preise",html:`
  <p>Für jede Nutzung des Schießstandes fällt eine kleine Gebühr an. Dafür gibt es bei uns <b>keine Pflichtarbeitsstunden</b>.</p>
  <p class="note">Es gilt immer die Preisliste, die vor Ort aushängt (Stand 06.01.2024).</p>`},
 {id:"schnupper",group:"stand",title:"Schießtraining, Schnupperschießen & Gutschein",html:`
  <p>Sie möchten das Schießen einmal ausprobieren? Wir bieten Schießtraining und Schnupperschießen mit <b>Groß- und Kleinkaliber</b> an – auch ohne eigene Waffe. Das Ganze gibt es auch als <b>Geschenkgutschein</b>.</p>
  ${DOC("Geschenkgutschein ansehen",SITE+"/wp-content/uploads/2025/05/Gutschein.pdf")}
  <p>Einen Termin vereinbaren Sie per WhatsApp: <b>0151 58501287</b>.</p>`},
 {id:"keiler",group:"stand",title:"Laufender Keiler auf 50 Meter",html:`
  <p>Seit dem <b>21. September 2019</b> gibt es auf der 50-Meter-Bahn den laufenden Keiler: Eine Scheibe mit einem Wildschwein fährt gleichmäßig von rechts nach links. Sie haben ein Schussfenster von <b>6 Metern</b>.</p>
  ${FACTS([["Entfernung","50 Meter"],["Bewegung","von rechts nach links, gleiche Geschwindigkeit"],["Schussfenster","6 Meter"],["Anschlag","meist Langwaffe, stehend frei"],["Besonders für","Jäger zur Vorbereitung auf die Schwarzwildjagd"]])}`},
 {id:"geschichte-stand",group:"stand",title:"Geschichte des Schießstandes",html:`
  <p>Schon bei der Gründung des Vereins 1994 gab es den Plan, einen Schießstand in Ortsnähe zu bauen. Hauptinitiator war Gunter Carl. Im Herbst 1996 kam die Baugenehmigung für das Grundstück an der Kohlesleite.</p>
  <p>Am <b>29. März 1998</b> wurde der Schießstand feierlich eröffnet – zuerst mit fünf Kurzwaffenbahnen, einer Kleinkaliberbahn und drei Großkaliberbahnen. Später kamen die Drehscheibenanlage, eine zweite Kleinkaliberbahn und eine vierte Großkaliberbahn dazu. Gegen Lärm wurden die Bahnen teilweise überdacht.</p>
  <p>Den Stand nutzen heute auch andere Vereine, Sicherheitsunternehmen und Jäger.</p><div class="strip">${PHOTOS["Bau und Eröffnung des Schießstandes"].slice(0,8).map(i=>FIG(i.t,"",i.f)).join("")}</div>`},

 /* ---------- Verein ---------- */
 {id:"historie",group:"verein",title:"Geschichte des Vereins",html:`
  <p>Die Wurzeln unseres Vereins reichen bis ins Jahr <b>1906</b> zurück – damals wurde am Knock geschossen, meist mit Kleinkaliber.</p><div class="strip two">${FIG(IMG.gruppe1906,"Schützengesellschaft am Schützenstand am Knock, um 1906")}${FIG(IMG.fritz1940,"Schütze am Knock, um 1940")}</div>
  <ol class="timeline"><li><b>1906</b> Schützengesellschaft am Knock</li><li><b>16.04.1994</b> Gründung des Schützenvereins Judenbach mit 11 Bürgern</li><li><b>14.12.1994</b> Eintrag ins Vereinsregister (VR 513, Amtsgericht Sonneberg)</li><li><b>29.03.1998</b> Eröffnung des Schießstandes</li><li><b>01.01.2000</b> Mitglied im BDS und im Thüringer Sportschützenverband</li><li><b>2026</b> 120 Jahre Schützentradition in Judenbach</li></ol>
  <p>Erster Vorstand 1994: Gunter Carl (Vorsitzender), Manfred Langbein (Stellvertreter), Steffen Ehrhardt (Schriftführer).</p>`},
 {id:"vorstand",group:"verein",title:"Der Vorstand",html:`
  <p>Laut Satzung besteht der Vorstand aus vier Personen. Zwei Vorstandsmitglieder vertreten den Verein gemeinsam.</p>
  <ul class="plain"><li>Vorsitzender</li><li>Stellvertretender Vorsitzender</li><li>Schriftführer</li><li>Kassenwart</li></ul>
  ${FIG(IMG.vorstand,"Der Vorstand des Schützenvereins Judenbach")}<p class="note">Namen und Aufgaben der Vorstandsmitglieder trägt der Verein hier ein; dazu kommt ein Knopf „Nachricht schreiben“.</p>`},
 {id:"satzung",group:"verein",title:"Satzung – das Wichtigste",html:`
  <p>Die Satzung ist die Grundordnung des Vereins (zuletzt geändert am 24.07.2021). Das Wichtigste in Kürze:</p>
  ${FACTS([["Sitz","Föritztal, Ortsteil Judenbach"],["Zweck","sportliches Schießen und jagdliches Übungsschießen, gemeinnützig"],["Mitglied werden","ab 18 Jahren, schriftlicher Antrag, der Vorstand entscheidet"],["Austritt","schriftlich, nur zum Jahresende, 2 Monate Frist"],["Beiträge","Höhe beschließt die Mitgliederversammlung"],["Mitgliederversammlung","einmal im Jahr, Einladung 2 Wochen vorher per E-Mail"]])}`},
 {id:"beitraege",group:"verein",title:"Mitgliedsbeiträge",html:`
  ${FACTS([["Jahresbeitrag (seit 1.1.2023)","120 € pro Jahr"],["Junge Mitglieder bis 21 Jahre","50 € pro Jahr"],["Austritt","bis 31. Oktober, formlos schriftlich an den Vorstand"]])}
  <h3>Bankverbindung</h3>
  ${FACTS([["Empfänger","Schützenverein Judenbach e.V."],["Bank","VR-Bank Coburg"],["IBAN","DE86 7836 0000 0001 0057 15"]])}`},
 {id:"bds",group:"verein",title:"Unser Verband: der BDS",html:`
  <img class="bdslogo" src="${IMG.bds}" alt="BDS" loading="lazy"><p>Seit dem 1. Januar 2000 ist unser Verein Mitglied im <b>Bund Deutscher Sportschützen 1975 e.V. (BDS)</b> und im Landesverband Thüringen. Der BDS ist ein bundesweiter Verband für das sportliche Schießen mit Kurz- und Langwaffen.</p>
  <h3>Was das für Sie bedeutet</h3>
  <ul class="plain"><li>Sie können bei <b>Wettkämpfen des BDS</b> starten – vom Vereinswettkampf über die Landesmeisterschaft bis zur Deutschen Meisterschaft.</li><li>Die Regeln für alle Disziplinen stehen im <b>Sporthandbuch</b> des BDS.</li><li>Über den Verein und den BDS bekommen Sie die <b>Bestätigung des Bedürfnisses</b> für die Waffenbehörde (Formulare unter „Formulare zum Herunterladen“).</li></ul>
  <h3>Disziplinen auf unserem Stand</h3>
  ${FACTS([["25 m","Kurzwaffe: Pistole und Revolver"],["50 m","Kleinkaliber, laufende Scheibe (Keiler)"],["100 m","Langwaffe Großkaliber, Zielfernrohr, Selbstlader, Ordonnanzgewehr"]])}
  <p>Unsere Schützen waren schon bei Landesmeisterschaften in Bottendorf und bei Deutschen Meisterschaften in Philippsburg dabei.</p>
  ${DOC("BDS – Internetseite","https://www.bdsnet.de","Web")}${DOC("BDS – Sporthandbuch","https://www.bdsnet.de/standard/sporthandbuch.html","Web")}${DOC("BDS – Wettkampfanmeldung","https://bdsmeisterschaft.de","Web")}${DOC("BDS Landesverband Thüringen","http://www.bdsthueringen.de/","Web")}`},
 {id:"kostenerstattung",group:"verein",form:"kosten",title:"Kostenerstattung beantragen",html:`
  <p>Sie waren für den Verein bei einem Wettkampf? Dann können Sie hier eine Erstattung Ihrer Kosten beantragen. Füllen Sie einfach das Formular aus.</p>`},

 /* ---------- Waffenrecht & Lehrgänge ---------- */
 {id:"sachkunde",group:"recht",title:"Waffensachkunde – wie geht das?",html:`
  <p>Wer eine eigene Waffe besitzen möchte, braucht einen Nachweis der <b>Sachkunde</b>. Dazu gibt es einen Lehrgang mit Prüfung. Ablauf und alles Wichtige stehen in der Info-Datei.</p>
  ${DOC("Info zum Waffensachkunde-Lehrgang",SITE+"/wp-content/uploads/2024/03/Waffensachkunde2024.pdf")}
  <p>Zur Anmeldung geht es auf der Seite <b>„Anmeldung zum Lehrgang“</b>.</p>`},
 {id:"lehrgang",group:"recht",title:"Anmeldung Waffensachkunde / Standaufsicht",html:`
  <p>Hier melden Sie sich für den Lehrgang <b>Waffensachkunde</b> oder für die Ausbildung zur <b>Schießstandaufsicht</b> an.</p>
  ${DOC("Anmeldeformular zum Lehrgang",SITE+"/wp-content/uploads/2026/01/Formular_Anmeldung-zum-Lehrgang.pdf")}
  <p class="note">Wichtig: Das Formular bitte am Computer ausfüllen, nicht auf dem Handy.</p>`},
 {id:"standaufsicht",group:"recht",title:"Standaufsichtsschulung 2026",html:`
  <p>Die Standaufsicht sorgt auf dem Schießstand für Sicherheit, weist die Schützen ein und weiß, was im Notfall zu tun ist.</p>
  ${FACTS([["Termin","bitte anfragen"],["Ort","Schießstand Judenbach"],["Dauer","etwa 3 Stunden"],["Voraussetzung","mindestens 18 Jahre und Waffenbesitzkarte"],["Kosten","50,00 € in bar vor Ort"],["Nachweis","Bestätigung des BDS-Landesverbands Thüringen"],["Kontakt","Steffen Carl, 0151 58501287"]])}`},
 {id:"waffengesetz",group:"recht",title:"Waffengesetz im Visier",html:`
  <p>Ein Video erklärt, welche Änderungen im Waffengesetz Schützen und Jäger betreffen.</p>
  ${DOC("Video auf YouTube ansehen","https://www.youtube.com/watch?v=PD38uvt80Co","Video")}`},
 {id:"aufbewahrung",group:"recht",title:"Waffenaufbewahrung – die Vorschriften",html:`
  <p>Waffen und Munition müssen zu Hause sicher aufbewahrt werden. Die Regeln wurden geändert. Bitte prüfen Sie, ob Ihr Waffenschrank den Vorschriften entspricht.</p>
  <div class="strip two">${FIG(IMG.aufb1,"Aufbewahrungsvorschriften, Seite 1 (zum Vergrößern antippen)")}${FIG(IMG.aufb2,"Aufbewahrungsvorschriften, Seite 2")}</div><p class="note">Auf der neuen Seite werden diese Vorschriften zusätzlich als gut lesbarer Text stehen.</p>`},

function qrSvg(text,px){
 if(typeof qrcode!=="function")return `<svg viewBox="0 0 10 10" width="${px}" height="${px}"><rect width="10" height="10" fill="#fff"/></svg>`;
 const q=qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount();let d="";
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c} ${r}h1v1h-1z`;
 return `<svg viewBox="-1 -1 ${n+2} ${n+2}" width="${px}" height="${px}" shape-rendering="crispEdges" role="img" aria-label="QR-Code"><rect x="-1" y="-1" width="${n+2}" height="${n+2}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}

const secondary=(label,attrs)=>`<button class="secondary" ${attrs}>${label}</button>`;

function upcoming(n){
 const ev=[];
 for(let i=0;i<35;i++){const d=ymd(addDays(TODAY,i));if(isWE(d))ev.push({date:d,kind:"shoot"})}
 ev.push({date:"2026-10-02",kind:"page",page:"schiessnachweis",title:"Schießnachweis „Flüchtiger Überläufer“"});
 S.comps.forEach(c=>ev.push({date:c.date,kind:"comp",comp:c.id,title:c.name}));
 return ev.filter(e=>e.date>=TD).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,n||99);
}
const shootTitle=d=>parse(d).getDay()===6?"13:00 – 16:00 Uhr":"10:00 – 12:00 Uhr";
function eventRow(e){
 if(e.kind==="shoot"){const i=dayInfo(e.date);return rowBtn(`data-go="day:${e.date}"`,longDate(e.date),`${shootTitle(e.date)} · ${t("comeCount",{n:i.n})}`,`<span class="rchip">${chip(dayWords(e.date))}${i.mine?`<span class="chip in">${t("youIn")}</span>`:""}</span>`)}
 if(e.kind==="comp")return rowBtn(`data-go="comp:${e.comp}"`,longDate(e.date),`${esc(e.title)}`,`<span class="rchip"><span class="chip comp">${t("compsh")}</span></span>`);
 return rowBtn(`data-go="page:${e.page}"`,longDate(e.date),esc(e.title),`<span class="rchip"><span class="chip neutral">Info</span></span>`)}
const myNext=()=>{if(!S.user)return null;const b=S.bookings.filter(x=>x.uid===S.user&&x.date>=TD).sort((a,b)=>(a.date+pad(a.h)).localeCompare(b.date+pad(b.h)))[0];return b};

/* ---------- Seiten ---------- */
function view(r){
 const [a,b,c]=r.split(":");
 switch(a){
 case "home":return HOMES[VARIANT.home]();
 case "book":return S.user?bookWizard():needLogin();
 case "comps":return compList();
 case "comp":return compDetail(b);
 case "enter":return S.user?enterWizard():needLogin();
 case "dates":return screen(t("dates"),t("b1h"),`<h2 class="sub">${t("comps")}</h2>${compList().replace(/^[\s\S]*?<div class="list">/,'<div class="list">')}<h2 class="sub">${t("nextShoot")}</h2>`+datesList());
 case "day":return dayView(b);
 case "msgs":return S.user?msgList():needLogin();
 case "chat":return S.user?chatView(r.slice(5)):needLogin();
 case "acct":return S.user?acctView():needLogin();
 case "my":return S.user?myView(b):needLogin();
 case "admin":return isSup()?(b==="panel"?panelView(c):adminView(b,c)):needLogin();
 case "info":return infoView();
 case "group":return groupView(b);
 case "page":return pageView(b);
 case "gal":return galView(b?r.slice(4):null);
 case "auth":return authView();
 case "help":return helpView();
 }
 if(typeof EXTRA!=="undefined"&&EXTRA[a])return EXTRA[a](b,c);
 return HOMES[VARIANT.home]();
}

function bookWizard(){
 const s=WB.step||1;
 if(s===1){
  const days=[...Array(21)].map((_,i)=>ymd(addDays(TODAY,i)));
  const we=days.filter(isWE),wd=days.filter(d=>!isWE(d));
  return screen(t("b1"),t("b1h"),`<div class="list">${we.map(d=>{const i=dayInfo(d);return rowBtn(`data-bday="${d}"`,longDate(d),shootTitle(d)+" · "+t("comeCount",{n:i.n}),`<span class="rchip">${chip(dayWords(d))}${i.mine?`<span class="chip in">${t("youIn")}</span>`:""}</span>`)}).join("")}</div>
  <details class="more"><summary>${t("weekday")}</summary><div class="list">${wd.map(d=>rowBtn(`data-bday="${d}"`,longDate(d),t("comeCount",{n:dayInfo(d).n}))).join("")}</div></details>`,{step:t("step",{a:1,b:4})})}
 if(s===2){
  const hs=hoursFor(WB.day);
  return screen(t("b2"),longDate(WB.day)+" · "+t("b2h"),`<div class="choices">${hs.map(h=>{const freeN=LANES.filter(l=>!S.bookings.some(x=>x.date===WB.day&&x.h===h&&x.lane===l.id)).length;const mine=S.bookings.some(x=>x.date===WB.day&&x.h===h&&x.uid===S.user);return `<button class="choice ${WB.hour===h?"sel":""}" data-bhour="${h}" ${freeN?"":"disabled"}><b>${pad(h)}:00</b><small>${mine?"✓ "+t("youIn"):t("free",{n:freeN})}</small></button>`}).join("")}</div>`,{step:t("step",{a:2,b:4})})}
 if(s===3){
  const opts=[100,50,25].map(g=>{const free=LANES.filter(l=>l.g===g&&!S.bookings.some(x=>x.date===WB.day&&x.h===WB.hour&&x.lane===l.id));return {g,free}});
  return screen(t("b3"),`${longDate(WB.day)}, ${pad(WB.hour)}:00 Uhr · ${t("b3h")}`,`<div class="choices wide">${opts.map(o=>`<button class="choice ${WB.dist===o.g?"sel":""}" data-bdist="${o.g}" ${o.free.length?"":"disabled"}><b>${o.g} m</b><span>${t("d"+o.g)}</span><small>${o.free.length?t("free",{n:o.free.length}):t("full")}</small></button>`).join("")}</div>
  ${WB.dist?`<details class="more" ${WB.manual?"open":""}><summary>${t("pickLane")}</summary><div class="choices">${opts.find(o=>o.g===WB.dist).free.map(l=>`<button class="choice small ${WB.lane===l.id?"sel":""}" data-blane="${l.id}"><b>${t("lane")} ${l.n}</b></button>`).join("")}</div></details>`:""}
  <div class="actions">${primary(t("next"),'data-bnext="4"',!WB.dist)}</div>`,{step:t("step",{a:3,b:4})})}
 if(s===4){
  return screen(t("b4"),"",`<dl class="summary"><dt>${t("day")}</dt><dd>${longDate(WB.day)}</dd><dt>${t("time")}</dt><dd>${pad(WB.hour)}:00 – ${pad(WB.hour+1)}:00 Uhr</dd><dt>${t("lane")}</dt><dd>${laneTxt(WB.lane)}</dd></dl>
  <div class="actions">${primary(t("bookNow"),"data-bconfirm")}</div>`,{step:t("step",{a:4,b:4})})}
 const w=dayWords(WB.day);
 return `<div class="done">${ic("check","big-check")}<h1 class="title">${t("booked")}</h1><p class="lead">${longDate(WB.day)}, ${pad(WB.hour)}:00 Uhr<br>${laneTxt(WB.lane)}</p></div>
 <section class="panel"><h2 class="sub">${t("whatnow")}</h2><p>${chip(w)}</p><p>${t("rule")}</p></section>
 <div class="stackv">${secondary(t("bookMore"),`data-bmore="${WB.day}"`)}${secondary(t("home"),'data-go="home"')}</div>`;
}
function freeLane(day,h,g){const l=LANES.find(l=>l.g===g&&!S.bookings.some(x=>x.date===day&&x.h===h&&x.lane===l.id));return l?l.id:null}

/* Wettkämpfe */
function compList(){
 return screen(t("comps"),"",`<div class="list">${S.comps.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(c=>{const mine=S.user&&S.regs.find(r=>r.comp===c.id&&r.uid===S.user);return rowBtn(`data-go="comp:${c.id}"`,esc(c.name),`${longDate(c.date)} · ${c.start} Uhr`,`<span class="rchip">${mine?`<span class="chip in">${t("c_in")}</span>`:`<span class="chip comp">${t("c_enter")}</span>`}${c.example?`<span class="chip neutral">${t("example")}</span>`:""}</span>`)}).join("")}</div>
 ${isBoard()?`<div class="stackv" style="margin-top:18px">${secondary("+ "+t("newComp"),'data-go="admin:new"')}</div>`:""}`);

function compDetail(id){
 const c=S.comps.find(x=>x.id===id);if(!c)return compList();
 const mine=S.user&&S.regs.find(r=>r.comp===id&&r.uid===S.user);const n=S.regs.filter(r=>r.comp===id).length;
 return screen(esc(c.name),`${longDate(c.date)} · ${c.start} – ${c.end} Uhr`,`
  ${mine?`<section class="panel ok"><h2 class="sub">${t("c_in")}</h2><p>${t("c_nr")}: <b class="num big">${mine.id}</b></p>${mine.entries.map(e=>`<p class="small">${esc(catN(e.cat))} · ${e.time} Uhr · ${laneTxt(e.lane)}</p>`).join("")}</section>${labelsHtml(mine,c)}<div class="stackv">${secondary(t("withdraw"),`data-withdraw="${mine.id}"`)}</div>`
  :`<section class="panel"><h2 class="sub">${t("disc")}</h2><ul class="plain">${c.cats.map(k=>`<li>${esc(catN(k))}</li>`).join("")}</ul><p class="small muted">${t("interval")}: 100 m ${c.interval[100]} · 50 m ${c.interval[50]} · 25 m ${c.interval[25]} ${t("minutes")} · ${t("entries",{n})}</p></section>
   <div class="stackv">${primary(t("c_enter"),`data-enter="${id}"`)}</div>`}
  ${results(c)}${isSup()?`<div class="stackv" style="margin-top:14px">${secondary(t("score"),`data-go="admin:score:${id}"`)}</div>`:""}`);
}
function results(c){
 const res=S.results.filter(r=>S.regs.find(x=>x.id===r.reg&&x.comp===c.id));if(!res.length)return "";
 const by={};res.forEach(r=>(by[r.cat]=by[r.cat]||[]).push(r));
 return `<section class="panel"><h2 class="sub">${t("results")}</h2>${Object.entries(by).map(([k,l])=>`<h3 class="h3">${esc(catN(k))}</h3><ol class="rank">${l.sort((a,b)=>b.pts-a.pts).map(r=>{const g=S.regs.find(x=>x.id===r.reg);return `<li><span>${esc(mem(g.uid).name)}</span><b class="num">${r.pts}</b></li>`}).join("")}</ol>`).join("")}</section>`}
const slotTimes=(c,g)=>{const o=[];for(let m=toMin(c.start);m<toMin(c.end);m+=c.interval[g])o.push(toHM(m));return o};
const laneAt=(c,g,time,skip)=>{const l=LANES.find(l=>l.g===g&&!S.regs.some(r=>r.comp===c.id&&r.entries.some(e=>e.lane===l.id&&e.time===time)));return l?l.id:null};
function clashes(c,catId,time){const s=toMin(time),e=s+c.interval[cat(catId).g];return Object.entries(WC.pick).some(([k,p])=>k!==catId&&p&&p.time&&(()=>{const s2=toMin(p.time),e2=s2+c.interval[cat(k).g];return s<e2&&s2<e})())}
function enterWizard(){
 const c=S.comps.find(x=>x.id===WC.comp);const s=WC.step||1;const total=WC.cats.length+2;
 if(s===1)return screen(t("c1"),esc(c.name)+" · "+t("c1h"),`<div class="stackv">${c.cats.map(k=>`<label class="check ${WC.cats.includes(k)?"on":""}"><input type="checkbox" data-ccat="${k}" ${WC.cats.includes(k)?"checked":""}><span>${esc(catN(k))}</span></label>`).join("")}</div>
  <div class="actions">${primary(t("next"),"data-cnext",!WC.cats.length)}</div>`,{step:t("step",{a:1,b:"…"})});
 if(s>=2&&s<2+WC.cats.length){const k=WC.cats[s-2],g=cat(k).g,p=WC.pick[k]||{};
  return screen(t("c2"),`<b>${esc(catN(k))}</b><br>${t("c2h")}`,`<div class="choices">${slotTimes(c,g).map(tm=>{const ln=laneAt(c,g,tm);const cl=clashes(c,k,tm);return `<button class="choice small ${p.time===tm?"sel":""}" data-ctime="${k}|${tm}" ${ln&&!cl?"":"disabled"}><b>${tm}</b>${p.time===tm?`<small>${t("lane")} ${LANES.find(l=>l.id===p.lane).n}</small>`:""}</button>`}).join("")}</div>
  <div class="actions">${primary(t("next"),"data-cnext",!p.time)}</div>`,{step:t("step",{a:s,b:total})})}
 if(s===2+WC.cats.length)return screen(t("c3"),esc(c.name)+" · "+longDate(c.date),`<dl class="summary">${WC.cats.map(k=>`<dt>${esc(catN(k))}</dt><dd>${WC.pick[k].time} Uhr · ${laneTxt(WC.pick[k].lane)}</dd>`).join("")}</dl><div class="actions">${primary(t("send"),"data-csend")}</div>`,{step:t("step",{a:total,b:total})});
 const r=S.regs.find(x=>x.id===WC.done);
 return `<div class="done">${ic("check","big-check")}<h1 class="title">${t("c_done")}</h1><p class="lead">${t("c_nr")}:</p><p class="num huge">${r.id}</p></div>${labelsHtml(r,c)}<div class="stackv">${secondary(t("home"),'data-go="home"')}</div>`;

function go(r,noPush){V.nav=false;if(!noPush&&r!==V.r)V.stack.push(V.r);if(r==="home")V.stack=[];

 ${regs.length?`<div class="list">${regs.map(r=>`<div class="row static preg"><span class="rt"><b>${esc(mem(r.uid).name)}</b><small>${r.uid}</small><span class="pcats">${r.entries.map(e=>`<span class="pcat"><b>${esc(catN(e.cat))}</b><span>${laneTxt(e.lane)} · ${e.time} Uhr</span></span>`).join("")}</span></span><span class="pnr"><span class="small muted">${pt("start")}</span><b class="num">${r.id}</b></span><span class="pact"><button class="secondary slim" data-preview="${r.id}">${pt("preview")}</button><button class="primary slim" data-print="${c.id}|${r.id}">${pt("printOne")}</button>${isBoard()?`<button class="link" data-withdraw="${r.id}">${pt("withdraw")}</button>`:""}</span></div>`).join("")}</div>`:`<p class="empty">${t("none")}</p>`}
 <div id="lpreview"></div>`;
}
function labelCard(r,e,c){const m=mem(r.uid);return `<div class="label"><div><p class="lc">SV Judenbach · ${esc(c.name)}</p><p class="ln">${esc(m.name)}</p><p class="lk">${esc(cat(e.cat).de)}</p><p class="li">${r.id}</p><p class="lm">${longDate(c.date)} · ${e.time} Uhr · ${laneTxt(e.lane)}</p></div>${qrSvg(`SVJ|${r.comp}|${r.id}|${e.cat}`,84)}</div>`}
function printLabels(cid,rid){
 const c=S.comps.find(x=>x.id===cid);const regs=S.regs.filter(r=>r.comp===cid&&(rid==="*"||r.id===rid));
 const css=`@page{size:A4;margin:10mm}body{font-family:Arial,Helvetica,sans-serif;margin:0;color:#111}h1{font-size:13pt;margin:0 0 6mm}.s{display:grid;grid-template-columns:repeat(3,63mm);gap:3mm}.l{border:1px dashed #999;height:40mm;padding:3mm;display:grid;grid-template-columns:1fr 26mm;gap:2mm;box-sizing:border-box;break-inside:avoid}.c{font-size:6pt;color:#555;text-transform:uppercase;letter-spacing:.05em}.n{font-weight:bold;font-size:11pt;text-transform:uppercase;margin-top:1mm}.k{font-size:8pt;margin-top:1mm}.i{font:bold 13pt monospace;margin-top:1.5mm}.m{font-size:6.5pt;color:#555;margin-top:1mm}svg{width:26mm;height:26mm}.no{margin:6mm 0 0;font-size:8pt;color:#555}@media screen{body{padding:10mm;background:#eee}.s{background:#fff;padding:5mm}}`;
 const body=regs.flatMap(r=>r.entries.map(e=>`<div class="l"><div><div class="c">SV Judenbach · ${esc(c.name)}</div><div class="n">${esc(mem(r.uid).name)}</div><div class="k">${esc(cat(e.cat).de)}</div><div class="i">${r.id}</div><div class="m">${longDate(c.date)} · ${e.time} Uhr · ${laneTxt(e.lane)}</div></div>${qrSvg(`SVJ|${r.comp}|${r.id}|${e.cat}`,98)}</div>`)).join("");
 const html=`<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Etiketten ${esc(c.name)}${rid==="*"?"":" – "+rid}</title><style>${css}</style></head><body><h1>Etiketten – ${esc(c.name)} · ${longDate(c.date)}</h1><div class="s">${body}</div><p class="no">Etiketten ausschneiden und auf die Scheibe kleben. QR-Code = ${"SVJ|Wettkampf|Startnummer|Disziplin"}.</p><script>setTimeout(()=>window.print(),400)<\/script></bo`+`dy></html>`;
 const w=window.open("","_blank");
 if(w){w.document.open();w.document.write(html);w.document.close()}
 else{const b=new Blob([html],{type:"text/html"});const u=URL.createObjectURL(b);location.href=u}
}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.ptab){PAN.tab=d.ptab;render();return}
 if(d.pcomp){PAN.comp=d.pcomp;render();return}
 if(d.print){const[cid,rid]=d.print.split("|");printLabels(cid,rid);return}
 if(d.preview){const r=S.regs.find(x=>x.id===d.preview);const c=S.comps.find(x=>x.id===r.comp);const box=$("#lpreview");box.innerHTML=`<section class="panel"><div class="row static" style="padding:0;border:0;min-height:0"><b>${pt("labels")} – ${esc(mem(r.uid).name)} (${r.id})</b><button class="link" data-closeprev>${pt("close")}</button></div><div class="labels">${r.entries.map(x=>labelCard(r,x,c)).join("")}</div><div class="stackv" style="margin-top:10px">${primary(pt("printOne"),`data-print="${c.id}|${r.id}"`)}</div></section>`;box.scrollIntoView({block:"start"});return}
 if(d.closeprev!==undefined){$("#lpreview").innerHTML="";return}
 if(d.delmsg){S.chats.info.msgs=S.chats.info.msgs.filter(m=>String(m.ts)!==d.delmsg);save();render();return}
});
document.addEventListener("submit",e=>{const f=e.target;if(f.id!=="allmsg")return;e.preventDefault();const v=$("#allmsgtxt").value.trim();if(!v)return;
 S.chats.info.msgs.push({by:S.user,ts:Date.now(),text:v});S.reads.info=S.chats.info.msgs.length;save();toast(pt("sent"));render();});

/* ---------- Bildbetrachter (Lightbox) + Videosteuerung ---------- */
(function(){
 const isImg=h=>/\.(jpe?g|png|gif|webp)(\?.*)?$/i.test(h||"");
 let LB={list:[],i:0};
 function box(){let b=document.getElementById("lb");if(!b){b=document.createElement("div");b.id="lb";b.hidden=true;b.innerHTML=`<button class="lb-x" data-lb="close" aria-label="Schließen">✕</button><button class="lb-p" data-lb="prev" aria-label="Zurück">‹</button><figure><img alt=""><figcaption></figcaption></figure><button class="lb-n" data-lb="next" aria-label="Weiter">›</button><p class="lb-c"></p>`;document.body.appendChild(b);
  b.addEventListener("click",e=>{const a=e.target.closest("[data-lb]");if(a){e.stopPropagation();({close,prev,next})[a.dataset.lb]();return}if(e.target===b)close()});
  document.addEventListener("keydown",e=>{if(b.hidden)return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")prev();if(e.key==="ArrowRight")next()});
  let sx=0;b.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});b.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx;if(dx>50)prev();if(dx<-50)next()})}
  return b}
 function show(){const b=box();const it=LB.list[LB.i];b.querySelector("img").src=it.src;b.querySelector("figcaption").textContent=it.cap||"";b.querySelector(".lb-c").textContent=(LB.i+1)+" / "+LB.list.length;b.hidden=false;document.body.classList.add("lb-open")}
 function close(){const b=box();b.hidden=true;document.body.classList.remove("lb-open")}
 function prev(){LB.i=(LB.i-1+LB.list.length)%LB.list.length;show()}
 function next(){LB.i=(LB.i+1)%LB.list.length;show()}
 document.addEventListener("click",e=>{
  const a=e.target.closest("a[href]");if(!a||!isImg(a.getAttribute("href")))return;
  e.preventDefault();
  const scope=a.closest(".strip,.gstrip,.hero-strip,.hist-pics,.albums,.prose,.page,.ssec")||document;
  const links=[...scope.querySelectorAll("a[href]")].filter(x=>isImg(x.getAttribute("href")));
  LB.list=links.map(x=>({src:x.getAttribute("href"),cap:(x.querySelector("img")||{}).alt||(x.closest("figure")?.querySelector("figcaption")||{}).textContent||""}));
  LB.i=Math.max(0,links.indexOf(a));show();
 },true);
 /* Video: einmal abspielen, Steuerung mit Start/Stop und Lautstärke daneben */
 function armVideos(){
  document.querySelectorAll("video:not([data-armed])").forEach(v=>{
   v.dataset.armed="1";v.loop=false;v.muted=true;v.volume=0.8;
   const wrap=document.createElement("div");wrap.className="vctl";
   wrap.innerHTML=`<button class="vc-play" aria-label="Start/Stop">▶</button><button class="vc-mute" aria-label="Ton an/aus">🔇</button><input class="vc-vol" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Lautstärke">`;
   const host=v.parentElement;if(getComputedStyle(host).position==="static")host.style.position="relative";host.appendChild(wrap);
   const play=wrap.querySelector(".vc-play"),mute=wrap.querySelector(".vc-mute"),vol=wrap.querySelector(".vc-vol");
   const sync=()=>{play.textContent=v.paused?"▶":"❚❚";mute.textContent=(v.muted||v.volume===0)?"🔇":"🔊"};
   play.onclick=e=>{e.stopPropagation();if(v.ended)v.currentTime=0;v.paused?v.play():v.pause();sync()};
   mute.onclick=e=>{e.stopPropagation();v.muted=!v.muted;sync()};
   vol.oninput=e=>{v.volume=+vol.value;v.muted=v.volume===0;sync()};
   v.addEventListener("play",sync);v.addEventListener("pause",sync);v.addEventListener("ended",sync);v.addEventListener("volumechange",sync);
   v.play().catch(()=>{});sync();
  });
 }
 const _render=render;render=function(){_render();armVideos()};armVideos();
})();

render();
